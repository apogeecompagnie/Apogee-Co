<script>
// ══════════════════════════════════════════════════════════════════════════
// CONFIG GLOBALE
// ══════════════════════════════════════════════════════════════════════════

const MONTHS = ["JANVIER","FÉVRIER","MARS","AVRIL","MAI","JUIN",
"JUILLET","AOÛT","SEPTEMBRE","OCTOBRE","NOVEMBRE","DÉCEMBRE"];

const DAYS = ["L","M","M","J","V","S","D"];

// Helpers sécurité
const sanitize = str => String(str).replace(/[<>]/g,"").trim();
const esc = str => String(str).replace(/[&<>"']/g, m => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
}[m]));

// ══════════════════════════════════════════════════════════════════════════
// CALENDRIER GLOBAL
// ══════════════════════════════════════════════════════════════════════════

let calDate = new Date();

function buildCalendar() {
  const monthEl = document.getElementById("cal-month");
  const gridEl  = document.getElementById("cal-grid");
  if (!monthEl || !gridEl) return;

  monthEl.textContent = `${MONTHS[calDate.getMonth()]} ${calDate.getFullYear()}`;

  const first = new Date(calDate.getFullYear(), calDate.getMonth(), 1);
  const last  = new Date(calDate.getFullYear(), calDate.getMonth()+1, 0);
  const today = new Date();

  let html = DAYS.map(d => `<div class="cd hd">${d}</div>`).join("");

  const start = (first.getDay()+6)%7;
  for (let i=0; i<start; i++) html += `<div class="cd od"></div>`;

  for (let d=1; d<=last.getDate(); d++) {
    const isToday =
      d===today.getDate() &&
      calDate.getMonth()===today.getMonth() &&
      calDate.getFullYear()===today.getFullYear();

    html += `<div class="cd${isToday?" td":""}">${d}</div>`;
  }

  gridEl.innerHTML = html;
}

window.calPrev = () => { calDate.setMonth(calDate.getMonth()-1); buildCalendar(); };
window.calNext = () => { calDate.setMonth(calDate.getMonth()+1); buildCalendar(); };

// ══════════════════════════════════════════════════════════════════════════
// NAVIGATION SERVICES
// ══════════════════════════════════════════════════════════════════════════

window.showServiceForm = function(svc) {
  document.querySelectorAll('[id^="form-"], #svc-selector')
    .forEach(el => el.style.display="none");

  const map = {
    courses:"form-courses",
    transport:"form-transport",
    menage:"form-menage",
    travaux:"form-travaux",
    admin:"form-admin"
  };

  if (map[svc]) {
    document.getElementById(map[svc]).style.display="block";
  } else {
    document.getElementById("form-generic").style.display="block";
  }
};

window.backToServices = function() {
  document.querySelectorAll('[id^="form-"]')
    .forEach(el => el.style.display="none");
  document.getElementById("svc-selector").style.display="block";
};

// ══════════════════════════════════════════════════════════════════════════
// COURSES
// ══════════════════════════════════════════════════════════════════════════

let crsItems = [];

function renderCrsList() {
  const el = document.getElementById("crs-list");
  if (!el) return;

  if (!crsItems.length) {
    el.innerHTML = `<div style="opacity:.5">Liste vide</div>`;
    return;
  }

  el.innerHTML = crsItems.map((item,i)=>`
    <div>
      ${esc(item.name)} (${esc(item.qty)})
      <button onclick="removeCrs(${i})">×</button>
    </div>
  `).join("");
}

window.addCrsItem = function() {
  const name = sanitize(document.getElementById("crs-item").value);
  const qty  = sanitize(document.getElementById("crs-qty").value || "1");

  if (!name) return;

  crsItems.push({name, qty});
  renderCrsList();
};

window.removeCrs = i => {
  crsItems.splice(i,1);
  renderCrsList();
};

// ══════════════════════════════════════════════════════════════════════════
// TRANSPORT
// ══════════════════════════════════════════════════════════════════════════

let tpPax = 1;

window.changePax = function(delta) {
  tpPax = Math.max(1, Math.min(9, tpPax + delta));
  document.getElementById("tp-pax").textContent = tpPax;
};

// ══════════════════════════════════════════════════════════════════════════
// MÉNAGE CALENDRIER
// ══════════════════════════════════════════════════════════════════════════

let menageDate = new Date();
let menageSelected = [];

function renderMenageCal() {
  const grid = document.getElementById("menage-cal-grid");
  if (!grid) return;

  const first = new Date(menageDate.getFullYear(), menageDate.getMonth(), 1);
  const last  = new Date(menageDate.getFullYear(), menageDate.getMonth()+1, 0);

  let html = "";

  for (let d=1; d<=last.getDate(); d++) {
    const key = `${menageDate.getFullYear()}-${menageDate.getMonth()+1}-${d}`;
    const selected = menageSelected.includes(key);

    html += `<div onclick="toggleMenageDay('${key}')"
      style="padding:8px;cursor:pointer;
      background:${selected?'gold':'transparent'}">
      ${d}
    </div>`;
  }

  grid.innerHTML = html;
}

window.toggleMenageDay = function(key) {
  if (menageSelected.includes(key)) {
    menageSelected = menageSelected.filter(d=>d!==key);
  } else {
    menageSelected.push(key);
  }
  renderMenageCal();
};

// ══════════════════════════════════════════════════════════════════════════
// TRAVAUX
// ══════════════════════════════════════════════════════════════════════════

const PRO_DATA = {
  plombier:"Plombier",
  electricien:"Électricien",
  serrurier:"Serrurier"
};

window.selectPro = function(pro) {
  document.getElementById("trx-pro").textContent = PRO_DATA[pro] || "Autre";
};

// ══════════════════════════════════════════════════════════════════════════
// ADMIN RDV
// ══════════════════════════════════════════════════════════════════════════

let adminSelectedSlot = null;

window.selectAdminSlot = function(slot) {
  adminSelectedSlot = slot;
  document.getElementById("admin-selected").textContent = slot;
};

// ══════════════════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════════════════

document.addEventListener("DOMContentLoaded", () => {
  buildCalendar();
  renderCrsList();
  renderMenageCal();
});
</script>
